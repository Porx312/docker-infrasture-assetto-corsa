# Install (once):
#   sudo cp /home/jose/assetto-infra/scripts/logrotate-assetto.conf /etc/logrotate.d/assetto-infra
# Dry-run:
#   sudo logrotate -d /etc/logrotate.d/assetto-infra
#
# Adjust the absolute path if the repo lives elsewhere.
# copytruncate is required: start.sh redirects with nohup and never reopens the fd.

/home/jose/assetto-infra/logs/ac-data-edge.log
/home/jose/assetto-infra/logs/ac-data-backend.log
/home/jose/assetto-infra/logs/telemetry-data.log
{
    size 100M
    rotate 5
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    dateext
    dateformat -%Y%m%d-%s
}
