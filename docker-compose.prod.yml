services:
  # Redis runs externally (shared backend / Dokploy). Set REDIS_HOST in .env.production.
  # ac-data-edge runs on the host (spawns 32-bit acServer); not containerized here.

  telemetry-data:
    build:
      context: ./telemetry-data
      dockerfile: Dockerfile
    container_name: assetto-telemetry-data
    env_file:
      - path: ./.env.production
        required: true
    volumes:
      - /home/jose/assetto-infra/server:/home/jose/assetto-infra/server:ro
    # Bind AC plugin ports 12000+ on the host (see server_cfg.ini UDP_PLUGIN_ADDRESS).
    network_mode: host
    restart: unless-stopped
