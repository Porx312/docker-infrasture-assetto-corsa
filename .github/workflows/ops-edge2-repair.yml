# One-shot ops: pull main on edge-2, repair acServer symlinks, reload infra.
name: Ops repair edge-2

on:
  workflow_dispatch:

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Repair links + deploy edge-2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST_EDGE_2 }}
          username: ${{ secrets.VPS_USER_EDGE_2 }}
          key: ${{ secrets.VPS_SSH_KEY_EDGE_2 }}
          command_timeout: 20m
          script: |
            set -euo pipefail
            cd /root/assetto-infra
            git fetch origin main
            git reset --hard origin/main
            chmod +x scripts/fix-acserver-instance-links.sh scripts/deploy-from-main.sh reload-infra.sh
            SERVERS_PATH=/root/assetto-infra/server ./scripts/fix-acserver-instance-links.sh
            ./scripts/deploy-from-main.sh edge
