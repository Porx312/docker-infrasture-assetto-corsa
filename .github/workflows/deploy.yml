name: Deploy fleet to VPS

on:
  push:
    branches:
      - main

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Load fleet matrix
        id: set
        run: |
          MATRIX="$(jq -c '.' deploy/fleet.json)"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Fleet targets: $MATRIX"

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - name: Resolve VPS host
        id: host
        run: |
          case "${{ matrix.hostSecret }}" in
            VPS_HOST_EDGE_EU)
              HOST='${{ secrets.VPS_HOST_EDGE_EU }}'
              ;;
            VPS_HOST_HUB)
              HOST='${{ secrets.VPS_HOST_HUB }}'
              ;;
            VPS_HOST)
              # Backward-compatible single-host secret
              HOST='${{ secrets.VPS_HOST }}'
              ;;
            *)
              echo "Unknown hostSecret: ${{ matrix.hostSecret }}"
              echo "Add a case branch in .github/workflows/deploy.yml when extending deploy/fleet.json"
              exit 1
              ;;
          esac
          if [ -z "$HOST" ]; then
            echo "Secret ${{ matrix.hostSecret }} is empty. Set it in repo Settings → Secrets."
            exit 1
          fi
          echo "value=$HOST" >> "$GITHUB_OUTPUT"

      - name: Deploy ${{ matrix.id }} (${{ matrix.role }})
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ steps.host.outputs.value }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd "${{ matrix.path }}"
            chmod +x scripts/deploy-from-main.sh
            ./scripts/deploy-from-main.sh "${{ matrix.role }}"

      - name: Health check (${{ matrix.id }})
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ steps.host.outputs.value }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            sleep 8
            curl -fsS "${{ matrix.healthUrl }}"

      - name: Verify telemetry-data host process (edge only, fleet runs start.sh dev)
        if: matrix.role == 'edge'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ steps.host.outputs.value }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            pgrep -f 'python3 main.py' >/dev/null
            pgrep -af 'tsx watch src/index|ac-data-edge' >/dev/null
