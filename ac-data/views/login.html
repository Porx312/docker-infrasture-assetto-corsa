<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content Manager — Login</title>
    <link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body>
    <div class="login-page">
        <div class="login-card">
            <h1>Content Manager</h1>
            <p class="login-subtitle">Sign in to manage cars, tracks and weather</p>
            <div class="login-error" id="error"></div>
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input class="input" type="text" id="username" name="username" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input class="input" type="password" id="password" name="password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary" id="submitBtn">Sign in</button>
            </form>
        </div>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const errorEl = document.getElementById('error');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorEl.classList.remove('show');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Signing in…';

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password }),
                    credentials: 'include'
                });

                const data = await res.json();

                if (res.ok && data.ok) {
                    window.location.href = '/admin/dashboard';
                } else {
                    errorEl.textContent = data.message || 'Login failed';
                    errorEl.classList.add('show');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Sign in';
                }
            } catch {
                errorEl.textContent = 'Connection error. Please try again.';
                errorEl.classList.add('show');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Sign in';
            }
        });
    </script>
</body>
</html>
