<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content Manager</title>
    <link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body class="admin-layout">
    <header class="admin-header">
        <h1>Content Manager</h1>
        <button type="button" class="btn btn-ghost" id="logoutBtn">Sign out</button>
    </header>

    <nav class="admin-toolbar" id="tabNav" aria-label="Content types"></nav>

    <main class="content">
        <div id="panelContainer"></div>
    </main>

    <div id="toastStack" class="toast-stack" aria-live="polite"></div>

    <div id="confirmModal" class="modal-overlay hidden" role="dialog" aria-modal="true">
        <div class="modal">
            <h3 id="confirmTitle">Confirm</h3>
            <p id="confirmMessage"></p>
            <div class="modal-actions">
                <button type="button" class="btn" id="confirmCancel">Cancel</button>
                <button type="button" class="btn btn-danger" id="confirmOk">Delete</button>
            </div>
        </div>
    </div>

    <div id="modModal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modTitle">
        <div class="modal modal-mod">
            <header class="modal-mod-header">
                <div>
                    <h3 id="modTitle"></h3>
                    <p id="modMeta" class="modal-mod-meta"></p>
                </div>
                <button type="button" class="btn btn-ghost btn-icon" id="modCloseBtn" aria-label="Close">✕</button>
            </header>
            <div id="modVariants" class="modal-mod-body"></div>
            <footer class="modal-mod-footer">
                <button type="button" class="btn btn-danger" id="modDeleteBtn">Delete mod</button>
            </footer>
        </div>
    </div>

    <div id="serverConfigModal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="serverConfigTitle">
        <div class="modal modal-server">
            <header class="modal-mod-header">
                <div>
                    <h3 id="serverConfigTitle">Instance branding</h3>
                    <p id="serverConfigMeta" class="modal-mod-meta"></p>
                </div>
                <button type="button" class="btn btn-ghost btn-icon" id="serverConfigCloseBtn" aria-label="Close">✕</button>
            </header>
            <form id="serverConfigForm" class="modal-server-body">
                <p class="modal-mod-section">Branding (this instance only)</p>
                <div class="branding-grid modal-server-grid">
                    <div class="form-group">
                        <label for="scDescription">Lobby description</label>
                        <textarea class="input branding-textarea" id="scDescription" rows="2"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="scWebLink">Website URL</label>
                        <input class="input" type="url" id="scWebLink">
                    </div>
                    <div class="form-group branding-full">
                        <label for="scCmBody">CM description body</label>
                        <textarea class="input branding-textarea" id="scCmBody" rows="4"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="scBannerUrl">Banner image</label>
                        <input class="input" type="url" id="scBannerUrl">
                    </div>
                    <div class="form-group">
                        <label for="scLoadingUrl">Loading screen</label>
                        <input class="input" type="url" id="scLoadingUrl">
                    </div>
                </div>
                <div class="branding-preview modal-server-preview">
                    <div class="branding-preview-block">
                        <span class="branding-preview-label">Banner</span>
                        <div class="branding-preview-img" id="scBannerPreview"></div>
                    </div>
                    <div class="branding-preview-block">
                        <span class="branding-preview-label">Loading</span>
                        <div class="branding-preview-img" id="scLoadingPreview"></div>
                    </div>
                    <div class="branding-preview-block branding-full">
                        <span class="branding-preview-label">CM description</span>
                        <pre class="branding-preview-text" id="scCmPreview"></pre>
                    </div>
                </div>
            </form>
            <footer class="modal-mod-footer">
                <button type="button" class="btn" id="serverConfigCancelBtn">Cancel</button>
                <button type="submit" form="serverConfigForm" class="btn btn-primary" id="serverConfigSaveBtn">Save branding</button>
            </footer>
        </div>
    </div>

    <div id="uploadOverlay" class="modal-overlay hidden">
        <div class="modal modal-upload">
            <div class="spinner"></div>
            <p id="uploadingStatus">Uploading…</p>
        </div>
    </div>

    <script type="module" src="/admin/js/dashboard.js"></script>
</body>
</html>
